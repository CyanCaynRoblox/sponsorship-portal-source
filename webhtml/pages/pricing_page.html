<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pricing Page</title>
    <link rel="stylesheet" href="pricing_page.css">
  <style>
   body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 0;
}

.pricing-switch {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 30px 0 20px 0;
    gap: 10px;
}

/* Switch styling */
.switch {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 28px;
}
.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}
.slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 34px;
}
.slider:before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
}
input:checked + .slider {
    background-color: #2196F3;
}
input:checked + .slider:before {
    transform: translateX(22px);
}

.pricing-columns {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 30px 0;
}

.plan {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    padding: 30px 20px;
    width: 250px;
    text-align: center;
}

.plan h2 {
    margin-bottom: 15px;
}

.price {
    font-size: 2em;
    margin: 15px 0;
    color: #2196F3;
}

.plan ul {
    list-style: none;
    padding: 0;
    margin-bottom: 20px;
}
.plan ul li {
    margin-bottom: 10px;
}

.plan button {
    background: #2196F3;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 25px;
    cursor: pointer;
    font-size: 1em;
    transition: background 0.2s;
}
.plan button:hover {
    background: #1769aa;
} 
  </style>
</head>
<body>
    <div class="pricing-switch">
        <span>Monthly</span>
        <label class="switch">
            <input type="checkbox" id="billingToggle">
            <span class="slider"></span>
        </label>
        <span>Yearly</span>
    </div>
    <div class="pricing-columns">
        <div class="plan" id="basic">
            <h2>Basic</h2>
            <p class="price" data-monthly="$10/mo" data-yearly="$100/yr">$10/mo</p>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
            </ul>
            <button>Select</button>
        </div>
        <div class="plan" id="pro">
            <h2>Pro</h2>
            <p class="price" data-monthly="$25/mo" data-yearly="$250/yr">$25/mo</p>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
            </ul>
            <button>Select</button>
        </div>
        <div class="plan" id="premium">
            <h2>Premium</h2>
            <p class="price" data-monthly="$50/mo" data-yearly="$500/yr">$50/mo</p>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
                <li>Feature 4</li>
            </ul>
            <button>Select</button>
        </div>
    </div>
    <script>
        // JS for switch
        document.getElementById('billingToggle').addEventListener('change', function() {
            document.querySelectorAll('.price').forEach(function(priceEl) {
                if (this.checked) {
                    priceEl.textContent = priceEl.getAttribute('data-yearly');
                } else {
                    priceEl.textContent = priceEl.getAttribute('data-monthly');
                }
            }, this);
        });
    </script>
</body>
</html>
