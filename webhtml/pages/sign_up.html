<!DOCTYPE html>
<html>
<style>
body {
  background: #f4f7fa;
  font-family: 'Segoe UI', Arial, sans-serif;
}

h1 {
  text-align: center;
  color: #222;
  margin-top: 40px;
}

p {
  color: #3887d8;
  text-align: center;
  font-size: 1.1em;
  margin-bottom: 30px;
}

form {
  background: #fff;
  max-width: 350px;
  margin: 30px auto;
  padding: 32px 24px;
  border-radius: 10px;
  box-shadow: 0 8px 32px rgba(60,60,120,0.10);
}

label {
  display: block;
  font-weight: 500;
  margin-bottom: 8px;
  color: #444;
}

input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 18px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  background: #f9fafb;
  font-size: 1em;
  transition: border 0.2s;
}

input[type="text"]:focus {
  border-color: #3887d8;
  outline: none;
  background: #fff;
}

input[type="submit"] {
  width: 100%;
  background: #3887d8;
  color: #fff;
  padding: 12px;
  border: none;
  font-size: 1.05em;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.2s;
}

input[type="submit"]:hover {
  background: #256bb2;
}
</style>
<body>

<div>
  <form action="/action_page.php">
    <label for="fname">First Name</label>
    <input type="text" id="fname" name="firstname" placeholder="Your name..">

    <label for="lname">Last Name</label>
    <input type="text" id="lname" name="lastname" placeholder="Your last name..">

    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="australia">Australia</option>
      <option value="canada">Canada</option>
      <option value="usa">USA</option>
    </select>
  
    <input type="submit" value="Submit">
  </form>
</div>

</body>
</html>
