<!DOCTYPE html>
<html>
  <meta charset="UTF-8">
<head>
  <title>Pricing - Sponsorship Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
h1 {
  color: blue;
  font-family: verdana;
  font-size: 300%;
  text-align: center;
}  
 #scrollToTop {
  display: none;
  position: fixed;
  bottom: 20px;
  right: 30px;
  z-index: 99;
  font-size: 18px;
  border: none;
  outline: none;
  background-color: red;
  color: white;
  cursor: pointer;
  padding: 15px;
  border-radius: 4px;
}
  body {
   min-height: 200vh; 
  }

#scrollToTop:hover {
  background-color: #555;
} 
</style>
</head>
<body>
      <!-- Pricing subject to change. (note, I still have to hook this up to other things, just creating the page layout for now -->
    <h1>Pricing</h1>
      <!--  This is the HTML and code for the button -->
    <button onclick="topFunction()" id="scrollToTop"
    title="Go to top">Top</button>
  <script>

let mybutton = document.getElementById("scrollToTop");
window.onscroll = function() {scrollFunction()};

function scrollFunction() {
  if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
    mybutton.style.display = "block";
  } else {
    mybutton.style.display = "none";
  }
}

// When the user clicks on the button, scroll to the top of the document
function topFunction() {
  document.body.scrollTop = 0;
  document.documentElement.scrollTop = 0;
}
</script>

</body>
</html>
